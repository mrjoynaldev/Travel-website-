services:
  - type: web
    name: codereportglobal-api
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fieldnote/api build
    startCommand: pnpm --filter @fieldnote/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CANONICAL_ORIGIN
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://codereportglobal.indevs.in,https://codereportglobal.vercel.app,https://codereportglobal-admin.vercel.app"
