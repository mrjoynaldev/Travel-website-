services:
  - type: web
    name: sundarban-yatri-api
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @fieldnote/api build
    startCommand: pnpm --filter @fieldnote/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # NOTE: do NOT set PORT — Render injects it and the start script listens on $PORT.
      - key: NODE_VERSION
        value: "22"
      - key: CANONICAL_ORIGIN
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://sundarbanyatri.com,https://www.sundarbanyatri.com,https://travel-website-admin-blond.vercel.app"
